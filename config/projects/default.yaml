max_changed_files: 20
allowed_extensions:
  - .py
  - .js
  - .ts
  - .json
  - .yaml
  - .yml
  - .md
blocked_files:
  - .env
  - .env.*
  - "*.pem"
  - "*.key"
commit_message:
  enabled: false
  generate_when_default: false
  preserve_user_message: true
  placeholders:
    - "Update"
    - "Changes"
    - "WIP"
